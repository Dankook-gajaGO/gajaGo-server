<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>가자GO 관리자</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f6f7f9; color: #1d2330; }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 20px; }
  form, .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  input, button { font: inherit; padding: 8px 12px; border: 1px solid #c9ced8; border-radius: 8px; }
  button { background: #2f6fed; color: #fff; border-color: #2f6fed; cursor: pointer; }
  button.danger { background: #fff; color: #c62828; border-color: #c62828; }
  .wrap { overflow-x: auto; background: #fff; border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px; border-bottom: 1px solid #eceef2; text-align: left; white-space: nowrap; }
  #msg { min-height: 1.4em; color: #c62828; }
</style>
</head>
<body>
<main>
  <h1>가자GO 회원 관리</h1>
  <form id="login">
    <label for="pw">관리자 비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button>불러오기</button>
  </form>
  <div class="bar"><input id="q" type="search" placeholder="아이디·닉네임·이메일 검색" aria-label="회원 검색"> <span id="count"></span></div>
  <p id="msg" role="status"></p>
  <div class="wrap"><table>
    <thead><tr><th>번호</th><th>아이디</th><th>닉네임</th><th>이메일</th><th>가입일</th><th>가계부</th><th>일정</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</main>
<script>
  let password = '', members = [];
  const $ = (id) => document.getElementById(id);

  async function api(path, method = 'GET') {
    const res = await fetch(path, { method, headers: { 'X-Admin-Password': password } });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.message || `오류 ${res.status}`);
    return body;
  }

  function render() {
    const q = $('q').value.trim().toLowerCase();
    const list = members.filter((m) => [m.loginId, m.nickname, m.email].some((v) => (v || '').toLowerCase().includes(q)));
    $('count').textContent = `${list.length}명 / 전체 ${members.length}명`;
    $('rows').replaceChildren(...list.map((m) => {
      const tr = document.createElement('tr');
      for (const v of [m.userId, m.loginId, m.nickname, m.email, (m.createdAt || '').replace('T', ' ').slice(0, 16), m.expenseCount, m.scheduleCount]) {
        const td = document.createElement('td'); td.textContent = v ?? ''; tr.append(td); // textContent: 닉네임에 HTML이 있어도 실행 안 됨
      }
      const td = document.createElement('td'), del = document.createElement('button');
      del.className = 'danger'; del.textContent = '삭제';
      del.onclick = () => remove(m);
      td.append(del); tr.append(td);
      return tr;
    }));
  }

  async function load() {
    $('msg').textContent = '';
    try { members = await api('/api/admin/members'); render(); }
    catch (e) { members = []; render(); $('msg').textContent = e.message; }
  }

  async function remove(m) {
    if (!confirm(`'${m.loginId}' 회원과 가계부·여행·일정·길찾기 기록을 모두 삭제할까요? 되돌릴 수 없어요.`)) return;
    try { await api(`/api/admin/members/${m.userId}`, 'DELETE'); await load(); }
    catch (e) { $('msg').textContent = e.message; }
  }

  $('login').onsubmit = (e) => { e.preventDefault(); password = $('pw').value; load(); };
  $('q').oninput = render;
</script>
</body>
</html>
